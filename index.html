<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creative Food Ordering App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .menu, .cart {
      margin: 20px auto;
      max-width: 700px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 10px;
      border-bottom: 1px solid #eee;
      transition: transform 0.3s;
    }
    .menu-item:hover {
      transform: scale(1.05);
    }
    .menu-item img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      margin-right: 10px;
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: #218838;
      transform: scale(1.1);
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .total {
      font-weight: bold;
      margin-top: 10px;
      font-size: 18px;
    }
    .checkout {
      background: #007bff;
      margin-top: 15px;
    }
    .checkout:hover {
      background: #0056b3;
    }
    /* Checkout modal */
    #checkout-modal {
      display: none;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
      z-index: 1000;
    }
    #checkout-modal h2 {
      margin-top: 0;
      color: #28a745;
    }
    #checkout-modal button {
      background: #dc3545;
      margin-top: 15px;
    }
    #checkout-modal button:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  <h1>🍔 aiml food ordering app </h1>

  <div class="menu">
    <h2>Menu</h2>
    <div class="menu-item">
      <span><img src="https://pngtree.com/so/burger" alt="Burger"> Burger - $100</span>
      <button onclick="addToCart('Burger', 100)">Add</button>
    </div>
    <div class="menu-item">
      <span><img src="C:\Users\lovky\Downloads\pizza.jpg" alt="Pizza"> Pizza - $150</span>
      <button onclick="addToCart('Pizza', 150)">Add</button>
    </div>
    <div class="menu-item">
      <span><img src="C:\Users\lovky\Downloads\pasta.jpg" alt="Pasta"> Pasta - $200</span>
      <button onclick="addToCart('Pasta', 200)">Add</button>
    </div>
    <div class="menu-item">
      <span><img src="C:\Users\lovky\Downloads\salad.jpg" alt="Salad"> Salad - $50</span>
      <button onclick="addToCart('Salad', 50)">Add</button>
    </div>
  </div>

  <div class="cart">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <div class="total">Total: $<span id="total">0</span></div>
    <button class="checkout" onclick="checkout()">Checkout</button>
  </div>

  <!-- Checkout modal -->
  <div id="checkout-modal">
    <h2>🎉 Order Confirmed!</h2>
    <p id="checkout-message"></p>
    <button onclick="closeModal()">Close</button>
  </div>

  <script>
    let cart = [];
    let total = 0;

    function addToCart(item, price) {
      cart.push({item, price});
      total += price;
      renderCart();
    }

    function renderCart() {
      const cartItemsDiv = document.getElementById('cart-items');
      cartItemsDiv.innerHTML = '';
      cart.forEach((c, index) => {
        cartItemsDiv.innerHTML += `
          <div class="cart-item">
            <span>${c.item} - $${c.price}</span>
            <button onclick="removeItem(${index})">Remove</button>
          </div>
        `;
      });
      const totalSpan = document.getElementById('total');
      totalSpan.innerText = total;
      totalSpan.style.color = "red";
      setTimeout(() => totalSpan.style.color = "black", 500);
    }

    function removeItem(index) {
      total -= cart[index].price;
      cart.splice(index, 1);
      renderCart();
    }

    function checkout() {
      if(cart.length === 0) {
        alert("Your cart is empty!");
      } else {
        document.getElementById('checkout-message').innerText = "Thank you! Total: $" + total;
        document.getElementById('checkout-modal').style.display = "block";
        cart = [];
        total = 0;
        renderCart();
      }
    }

    function closeModal() {
      document.getElementById('checkout-modal').style.display = "none";
    }
  </script>
</body>
</html>
